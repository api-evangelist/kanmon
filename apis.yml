aid: kanmon
name: Kanmon
description: >-
  Kanmon is an embedded-lending platform that lets vertical SaaS and business-management
  software offer working capital to their customers without becoming a lender themselves.
  Through the Kanmon Public V2 REST API and the embeddable Kanmon Connect UI, platforms
  can originate term loans, lines of credit, invoice financing, Accounts Payable financing,
  and integrated merchant cash advances. Kanmon is the licensed lender and owns underwriting,
  compliance, and credit risk, while partners integrate financing directly into their existing
  product with API keys, official SDKs, prebuilt borrower UI components, and outbound webhooks.
