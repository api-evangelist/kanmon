          example: 500000
          type: number
        createdAt:
          description: Creation UTC ISO 8601 timestamp of the draw request.
          example: 2022-06-01T03:57:26.115Z
          type: string
        updatedAt:
          description: Last updated UTC ISO 8601 timestamp of the draw request.
          example: 2022-06-01T03:57:26.115Z
          type: string
