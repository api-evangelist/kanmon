            \ a repayment period, the repayment amount would be $20."
          example: 20
          type: number
        feeFactor:
          description: The fee percentage charged as the borrowing cost of the loan.
            E.g. a value of `1.3` means a 30% fee.
          example: 1.3
          type: number
        totalRepaymentCents:
          description: "The total repayment amount in cents required to settle and\
            \ close the debt. E.g. for a $10,000 loan with a fee factor of 1.3, the\
            \ repayment amount equates to $13,000."
          example: 1300000
          type: number
        advanceBalanceCents:
          description: The total repayment amount less the amount repaid - in cents.
          example: 1100000
          type: number
        monthlyMinimumPaymentAmountCents:
          description: The monthly minimum payment amount - in cents. `null` if there
            is no monthly minimum payment.
          example: 100000
          nullable: true
          type: object
        feeAmountCents:
          description: The calculated fee amount in cents.
          example: 300000
          type: number
      required:
      - advanceAmountCents
      - advanceBalanceCents
      - feeAmountCents
      - feeFactor
      - monthlyMinimumPaymentAmountCents
      - productType
      - repaymentPercentage
      - totalRepaymentCents
      type: object
    LineOfCreditServicingData:
      properties:
        productType:
          $ref: '#/components/schemas/ProductType'
        totalLimitCents:
          description: The total credit limit - in cents.
          example: 1000000
          type: number
        availableLimitCents:
          description: The total limit less the amount of balance outstanding - in
            cents.
          example: 900000
          type: number
        interestRatePercentage:
          description: The rate of interest on the loan. E.g. a value of `10` means
            10%.
          example: 10
          type: number
        feePercentage:
          description: The fee percentage charged as the borrowing cost of the loan.
            E.g. a value of `2` means a 2% fee.
          example: 2
          type: number
        repaymentDurationMonths:
          deprecated: true
          description: "The duration of the repayment for each draw - in months. Deprecated:\
            \ use `numPaymentPeriods` and `repaymentCadence` instead."
          example: 3
          type: number
        repaymentCadence:
          $ref: '#/components/schemas/RepaymentCadence'
        gracePeriodDays:
          description: The number of days after each draw during which no installment
            payments are due. Interest still accrues.
          example: 30
          type: number
        numPaymentPeriods:
          description: The number of installment payment periods for each draw.
          example: 3
          type: number
      required:
      - availableLimitCents
      - feePercentage
      - gracePeriodDays
      - interestRatePercentage
      - numPaymentPeriods
      - productType
      - repaymentCadence
      - repaymentDurationMonths
      - totalLimitCents
      type: object
    LoanStatus:
      description: |-
        The current status of the loan.<table>

        <tr>
        <td>CURRENT</td>
        <td>All scheduled loan payments are up to date</td>
        </tr>
        <tr>
        <td>LATE</td>
        <td>One or more scheduled loan payments are past due</td>
        </tr>
        <tr>
        <td>FULLY_PAID</td>
        <td>The loan has been fully repaid and closed. Not applicable for AR, AP, or Line of Credit products</td>
        </tr>
        <tr>
        <td>REFINANCED</td>
        <td>The loan has been refinanced and replaced by a new loan agreement. Not applicable for AR, AP, or Line of Credit products</td>
        </tr>
        <tr>
        <td>CLOSED</td>
        <td>The loan has been closed and is no longer active</td>
        </tr>
        <tr>
        <td>DEFAULTED</td>
        <td>The loan has been marked as defaulted due to missed payments</td>
        </tr>
        </table>
      enum:
      - CURRENT
      - LATE
      - FULLY_PAID
      - REFINANCED
      - CLOSED
      - DEFAULTED
      type: string
