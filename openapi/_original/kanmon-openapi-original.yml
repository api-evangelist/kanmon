          - CHECKING
          example: CHECKING
          type: string
        roles:
          description: "The bank account’s roles. Currently, we only support creating\
            \ disbursement bank account. We may support others in the future."
          example:
          - DISBURSEMENT
          items:
            enum:
            - DISBURSEMENT
            type: string
          type: array
