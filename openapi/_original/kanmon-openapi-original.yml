    InvoiceStatus:
      description: "The status of the invoice.\n  <table>\n    <tr>\n      <td>INVOICE_CREATED</td>\n\
        \      <td>The business has submitted an invoice and it is under review.<td/>\n\
        \    </tr>\n    <tr>\n      <td>INVOICE_FUNDED</td>\n      <td>\n        The\
        \ funds for the invoice have been disbursed. The business is now\n       \
        \ expected to pay back the funds. Note that an invoice transitions to\n  \
        \      this state when the disbursement is initiated, not when the disbursement\n\
        \        has cleared.\n      </td>\n    </tr>\n    <tr>\n      <td>INVOICE_PAID_IN_FULL</td>\n\
        \      <td> A payment was made that fully paid off an outstanding invoice.</td>\n\
        \    </tr>\n    <tr>\n      <td>INVOICE_RETURNED</td>\n      <td>The invoice\
        \ was returned (e.g. disbursement cancelled or funds recollected from the\
        \ platform).</td>\n    </tr>\n    <tr>\n      <td>INVOICE_PENDING_RETURN</td>\n\
        \      <td>The disbursement return has been initiated and we are waiting for\
        \ funds to be recollected from the platform.</td>\n    </tr>\n    <tr>\n \
        \     <td>LATE</td>\n      <td>A payment was not made towards an outstanding\
        \ invoice.</td>\n    </tr>\n    <tr>\n      <td>REJECTED</td>\n      <td>\
        \ An invoice was rejected during the funding step.</td>\n    </tr>\n    <tr>\n\
        \      <td>DEFAULTED</td>\n      <td>A payment was not made towards an outstanding\
        \ invoice and we were unable to encourage the borrower to make a payment.</td>\n\
        \    </tr>\n  </table>\n  "
      enum:
      - INVOICE_CREATED
      - INVOICE_FUNDED
      - INVOICE_PAID_IN_FULL
      - INVOICE_RETURNED
      - INVOICE_PENDING_RETURN
      - REJECTED
      - IN_REVIEW
      - DEFAULTED
      - LATE
      type: string
    InvoiceRepaymentScheduleItem:
