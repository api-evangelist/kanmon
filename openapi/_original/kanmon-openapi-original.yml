        accountNumber:
          description: "The business’s bank account number. Only digits, no formatting."
          example: "123456789"
          type: string
        routingNumber:
          description: "The business’s bank routing number. Should be a 9 digits number,\
            \ no formatting."
          example: "123456789"
          type: string
