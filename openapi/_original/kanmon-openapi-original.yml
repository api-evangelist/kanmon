  /api/platform/v2/payment-intents:
    get:
      description: "A payment intent represents a planned payment on an issued product,\
        \ such as a disbursement, scheduled repayment, fee, or refund. It tracks intended\
        \ amounts, whether the payment is late, settlement progress via the confirmed\
        \ and pending amount fields, and the payment orders that actually move funds.\
        \ Payment intents may be cancelled when superseded — for example, by an early\
        \ payoff."
      operationId: getPaymentIntents
      parameters:
      - description: A comma delimited list of Kanmon’s unique payment intent IDs.
        example: "3789e162-b5ba-45a9-a8ea-27682ed7ea66,fa075e48-014f-46c6-a8cc-b2b9b74c5e4a"
        explode: true
        in: query
        name: ids
        required: false
        schema:
          type: string
        style: form
      - description: A comma delimited list of Kanmon’s unique IDs for invoices.
        example: "2a479896-c24c-4bd3-a8af-b3e15092974a,92eede22-dccc-4bb7-bae7-74b62a403c9d"
        explode: true
